services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-together}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env}
      POSTGRES_DB: ${POSTGRES_DB:-together}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  api:
    build:
      context: ./nest-api
      dockerfile: Dockerfile
      target: production
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_REMEMBER_EXPIRES_IN=${JWT_REMEMBER_EXPIRES_IN:-30d}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTH=${SMTP_AUTH}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - PORT=3000
      - CORS_ORIGINS=${CORS_ORIGINS}
      - NODE_ENV=production
    volumes:
      - api_uploads:/app/public/uploads

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    restart: always
    ports:
      - 80
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.together-webapp.rule=Host(`to-get-there.creative-developer.com`)"
      - "traefik.http.routers.together-webapp.entrypoints=web"
      - "traefik.http.routers.together-webapp-secure.rule=Host(`to-get-there.creative-developer.com`)"
      - "traefik.http.routers.together-webapp-secure.entrypoints=websecure"
      - "traefik.http.routers.together-webapp-secure.tls.certResolver=letsencrypt"
      - "traefik.http.services.together-webapp.loadbalancer.server.port=80"

volumes:
  api_uploads:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
    name: dokploy-network
    # external: true
